<svg width="1600" height="500" viewBox="0 0 1600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="1600" height="500">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        .banner {
          position: relative;
          width: 1600px;
          height: 500px;
          overflow: hidden;
          font-family: "Segoe UI", Roboto, Arial, sans-serif;
          color: #fff;
          background:
            radial-gradient(circle at 20% 20%, rgba(40, 105, 255, 0.18), transparent 28%),
            radial-gradient(circle at 80% 18%, rgba(0, 186, 255, 0.12), transparent 25%),
            radial-gradient(circle at 60% 85%, rgba(61, 27, 154, 0.12), transparent 28%),
            linear-gradient(135deg, #020611 0%, #04102a 35%, #04183d 65%, #020611 100%);
        }

        .stars,
        .stars2,
        .stars3 {
          position: absolute;
          inset: 0;
          background-repeat: repeat;
          pointer-events: none;
        }

        .stars {
          opacity: 0.95;
          background-image:
            radial-gradient(2px 2px at 40px 60px, rgba(255,255,255,0.95), transparent 60%),
            radial-gradient(1.5px 1.5px at 120px 160px, rgba(255,255,255,0.8), transparent 60%),
            radial-gradient(2px 2px at 220px 90px, rgba(170,210,255,0.8), transparent 60%),
            radial-gradient(1.5px 1.5px at 340px 40px, rgba(255,255,255,0.85), transparent 60%),
            radial-gradient(2px 2px at 470px 120px, rgba(255,255,255,0.75), transparent 60%),
            radial-gradient(1.5px 1.5px at 590px 65px, rgba(157,218,255,0.8), transparent 60%),
            radial-gradient(2px 2px at 760px 110px, rgba(255,255,255,0.85), transparent 60%),
            radial-gradient(1.5px 1.5px at 920px 70px, rgba(255,255,255,0.85), transparent 60%),
            radial-gradient(2px 2px at 1080px 145px, rgba(203,234,255,0.8), transparent 60%),
            radial-gradient(1.5px 1.5px at 1240px 48px, rgba(255,255,255,0.85), transparent 60%),
            radial-gradient(2px 2px at 1360px 120px, rgba(255,255,255,0.8), transparent 60%),
            radial-gradient(1.5px 1.5px at 1490px 85px, rgba(255,255,255,0.8), transparent 60%);
          animation: drift 26s linear infinite;
        }

        .stars2 {
          opacity: 0.5;
          background-image:
            radial-gradient(1px 1px at 70px 200px, rgba(255,255,255,0.95), transparent 60%),
            radial-gradient(1px 1px at 180px 310px, rgba(169,214,255,0.9), transparent 60%),
            radial-gradient(1px 1px at 320px 250px, rgba(255,255,255,0.9), transparent 60%),
            radial-gradient(1px 1px at 480px 360px, rgba(255,255,255,0.9), transparent 60%),
            radial-gradient(1px 1px at 620px 280px, rgba(255,255,255,0.85), transparent 60%),
            radial-gradient(1px 1px at 780px 340px, rgba(255,255,255,0.95), transparent 60%),
            radial-gradient(1px 1px at 920px 240px, rgba(177,225,255,0.9), transparent 60%),
            radial-gradient(1px 1px at 1080px 310px, rgba(255,255,255,0.9), transparent 60%),
            radial-gradient(1px 1px at 1230px 225px, rgba(255,255,255,0.85), transparent 60%),
            radial-gradient(1px 1px at 1380px 300px, rgba(255,255,255,0.85), transparent 60%);
          animation: twinkle 6s ease-in-out infinite alternate;
        }

        .stars3 {
          opacity: 0.28;
          background-image:
            radial-gradient(220px 220px at 88% 15%, rgba(35,116,255,0.17), transparent 65%),
            radial-gradient(140px 140px at 18% 12%, rgba(93,185,255,0.12), transparent 65%),
            radial-gradient(170px 170px at 68% 78%, rgba(128,92,255,0.12), transparent 65%);
          filter: blur(8px);
        }

        .content {
          position: relative;
          z-index: 2;
          display: flex;
          height: 100%;
          width: 100%;
          padding: 38px 48px 34px 58px;
        }

        .left {
          width: 62%;
          display: flex;
          flex-direction: column;
          justify-content: center;
          padding-right: 24px;
        }

        .hello-wrap {
          position: relative;
          margin-bottom: 6px;
          height: 78px;
        }

        .hello {
          position: relative;
          z-index: 2;
          font-size: 68px;
          line-height: 1;
          font-weight: 700;
          font-style: italic;
          letter-spacing: 1px;
          color: #eaf6ff;
          text-shadow:
            0 0 8px rgba(109, 188, 255, 0.8),
            0 0 18px rgba(109, 188, 255, 0.55),
            0 0 36px rgba(62, 151, 255, 0.35);
          animation: fadeUp 1s ease-out both;
        }

        .ufo {
          position: absolute;
          left: 470px;
          top: -6px;
          font-size: 64px;
          filter: drop-shadow(0 0 10px rgba(108,190,255,0.65));
          animation: ufoFloat 4.5s ease-in-out infinite;
        }

        .ufo-trail {
          position: absolute;
          left: 405px;
          top: 20px;
          width: 230px;
          height: 56px;
          border: 3px solid rgba(100, 190, 255, 0.8);
          border-color: rgba(100, 190, 255, 0.9) transparent transparent transparent;
          border-radius: 60% 80% 0 0;
          transform: rotate(8deg);
          filter: drop-shadow(0 0 10px rgba(100,190,255,0.45));
          opacity: 0.95;
        }

        .intro {
          font-size: 38px;
          line-height: 1.2;
          font-weight: 800;
          letter-spacing: 1px;
          color: #ffffff;
          margin-bottom: 22px;
          text-shadow: 0 0 16px rgba(0, 149, 255, 0.22);
          animation: fadeUp 1s ease-out 0.2s both;
        }

        .role {
          font-size: 34px;
          line-height: 1.2;
          font-weight: 800;
          letter-spacing: 8px;
          margin-bottom: 30px;
          color: #f8fbff;
          text-transform: uppercase;
          text-shadow: 0 0 14px rgba(0, 174, 255, 0.25);
          animation: fadeUp 1s ease-out 0.35s both;
        }

        .icons-row {
          display: flex;
          flex-wrap: wrap;
          gap: 16px;
          max-width: 920px;
          animation: fadeUp 1s ease-out 0.5s both;
        }

        .icon-card {
          width: 112px;
          height: 118px;
          border-radius: 24px;
          background:
            linear-gradient(180deg, rgba(10, 25, 52, 0.92), rgba(6, 16, 35, 0.92));
          border: 1px solid rgba(95, 181, 255, 0.35);
          box-shadow:
            0 0 0 1px rgba(255,255,255,0.02) inset,
            0 10px 24px rgba(0, 0, 0, 0.35),
            0 0 20px rgba(0, 157, 255, 0.08);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 10px;
          position: relative;
          overflow: hidden;
        }

        .icon-card::before {
          content: "";
          position: absolute;
          inset: 0;
          background: linear-gradient(120deg, transparent 10%, rgba(255,255,255,0.08) 50%, transparent 90%);
          transform: translateX(-120%);
          animation: shine 5.5s ease-in-out infinite;
        }

        .icon-card img {
          width: 52px;
          height: 52px;
          position: relative;
          z-index: 2;
          filter: drop-shadow(0 0 10px rgba(255,255,255,0.14));
        }

        .icon-card span {
          position: relative;
          z-index: 2;
          font-size: 15px;
          font-weight: 700;
          color: #f4f8ff;
          text-align: center;
          line-height: 1.15;
          padding: 0 6px;
        }

        .icon-card:nth-child(1) { animation: floatCard 4.5s ease-in-out infinite; }
        .icon-card:nth-child(2) { animation: floatCard 4.5s ease-in-out 0.3s infinite; }
        .icon-card:nth-child(3) { animation: floatCard 4.5s ease-in-out 0.6s infinite; }
        .icon-card:nth-child(4) { animation: floatCard 4.5s ease-in-out 0.9s infinite; }
        .icon-card:nth-child(5) { animation: floatCard 4.5s ease-in-out 1.2s infinite; }
        .icon-card:nth-child(6) { animation: floatCard 4.5s ease-in-out 1.5s infinite; }
        .icon-card:nth-child(7) { animation: floatCard 4.5s ease-in-out 1.8s infinite; }

        .right {
          position: relative;
          width: 38%;
          height: 100%;
        }

        .moon {
          position: absolute;
          right: 240px;
          top: 18px;
          width: 96px;
          height: 96px;
          border-radius: 50%;
          background:
            radial-gradient(circle at 38% 34%, #7f97cb 0%, #425582 42%, #1b2543 70%, #0b1020 100%);
          box-shadow:
            0 0 20px rgba(131, 168, 255, 0.2),
            inset -18px -12px 24px rgba(0,0,0,0.45),
            inset 8px 8px 18px rgba(255,255,255,0.08);
          opacity: 0.95;
          animation: moonFloat 6s ease-in-out infinite;
        }

        .moon::before,
        .moon::after {
          content: "";
          position: absolute;
          border-radius: 50%;
          background: rgba(11, 20, 42, 0.25);
        }

        .moon::before {
          width: 14px;
          height: 14px;
          left: 25px;
          top: 22px;
        }

        .moon::after {
          width: 10px;
          height: 10px;
          right: 22px;
          top: 38px;
        }

        .shooting,
        .shooting2 {
          position: absolute;
          height: 3px;
          background: linear-gradient(90deg, rgba(255,255,255,0), rgba(137,211,255,0.95), rgba(255,255,255,0));
          border-radius: 999px;
          filter: drop-shadow(0 0 8px rgba(138, 223, 255, 0.7));
          transform: rotate(-35deg);
        }

        .shooting {
          top: 112px;
          right: 40px;
          width: 170px;
          animation: shoot1 3.8s linear infinite;
        }

        .shooting2 {
          top: 162px;
          right: 235px;
          width: 120px;
          animation: shoot2 4.8s linear infinite;
        }

        .earth-wrap {
          position: absolute;
          right: -55px;
          bottom: -46px;
          width: 500px;
          height: 500px;
          animation: earthFloat 6.2s ease-in-out infinite;
        }

        .earth-glow {
          position: absolute;
          inset: 40px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(98, 200, 255, 0.15) 0%, rgba(36,101,255,0.08) 42%, transparent 72%);
          filter: blur(14px);
        }

        .earth {
          position: absolute;
          right: 0;
          bottom: 0;
          width: 430px;
          height: 430px;
          border-radius: 50%;
          overflow: hidden;
          border: 2px solid rgba(255,255,255,0.08);
          background:
            radial-gradient(circle at 32% 26%, rgba(255,255,255,0.8), transparent 20%),
            radial-gradient(circle at 62% 14%, rgba(80,219,255,0.25), transparent 30%),
            radial-gradient(circle at 28% 70%, rgba(36, 132, 255, 0.18), transparent 26%),
            linear-gradient(145deg, #06122f 0%, #0a2f6b 18%, #1d78d9 42%, #0f4ea4 68%, #071731 100%);
          box-shadow:
            0 0 26px rgba(60, 174, 255, 0.35),
            0 0 60px rgba(36, 148, 255, 0.18),
            inset -24px -32px 46px rgba(0,0,0,0.4),
            inset 12px 18px 28px rgba(255,255,255,0.1);
          animation: spinEarth 22s linear infinite;
        }

        .earth::after {
          content: "";
          position: absolute;
          inset: 0;
          background:
            radial-gradient(circle at 65% 24%, rgba(255,255,255,0.16), transparent 20%),
            radial-gradient(circle at 34% 48%, rgba(255,255,255,0.08), transparent 16%),
            radial-gradient(circle at 59% 70%, rgba(255,255,255,0.10), transparent 22%);
          mix-blend-mode: screen;
          opacity: 0.8;
        }

        .continent {
          position: absolute;
          background: linear-gradient(180deg, #8dd947 0%, #5fc137 100%);
          filter: saturate(1.05);
          box-shadow: 0 0 8px rgba(143, 218, 74, 0.08);
        }

        .c1 {
          width: 120px;
          height: 72px;
          left: 214px;
          top: 74px;
          border-radius: 48% 52% 55% 45% / 45% 55% 50% 50%;
          transform: rotate(-12deg);
        }

        .c2 {
          width: 90px;
          height: 58px;
          left: 262px;
          top: 135px;
          border-radius: 55% 45% 46% 54% / 52% 48% 58% 42%;
          transform: rotate(10deg);
        }

        .c3 {
          width: 72px;
          height: 114px;
          left: 286px;
          top: 196px;
          border-radius: 46% 54% 58% 42% / 38% 48% 52% 62%;
          transform: rotate(16deg);
        }

        .c4 {
          width: 92px;
          height: 52px;
          left: 86px;
          top: 110px;
          border-radius: 45% 55% 58% 42% / 54% 46% 60% 40%;
          transform: rotate(-20deg);
        }

        .c5 {
          width: 62px;
          height: 78px;
          left: 130px;
          top: 155px;
          border-radius: 55% 45% 40% 60% / 48% 56% 44% 52%;
          transform: rotate(5deg);
        }

        .c6 {
          width: 74px;
          height: 54px;
          left: 180px;
          top: 270px;
          border-radius: 48% 52% 48% 52% / 55% 45% 55% 45%;
          transform: rotate(18deg);
        }

        .earth-shadow {
          position: absolute;
          right: 6px;
          bottom: 8px;
          width: 380px;
          height: 390px;
          border-radius: 50%;
          background: radial-gradient(circle at 40% 38%, transparent 40%, rgba(0,0,0,0.38) 78%);
          pointer-events: none;
        }

        .ring {
          position: absolute;
          right: 40px;
          bottom: 58px;
          width: 450px;
          height: 450px;
          border-radius: 50%;
          border: 1px solid rgba(103, 184, 255, 0.08);
          box-shadow: 0 0 20px rgba(72, 154, 255, 0.05);
        }

        .ring::after {
          content: "";
          position: absolute;
          inset: 18px;
          border-radius: 50%;
          border: 1px solid rgba(103, 184, 255, 0.05);
        }

        .bottom-fade {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 0;
          height: 70px;
          background: linear-gradient(180deg, rgba(2,6,17,0), rgba(2,6,17,0.32));
          pointer-events: none;
        }

        @keyframes fadeUp {
          from {
            opacity: 0;
            transform: translateY(18px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }

        @keyframes drift {
          from { transform: translateX(0); }
          to { transform: translateX(-45px); }
        }

        @keyframes twinkle {
          0%   { opacity: 0.32; }
          50%  { opacity: 0.62; }
          100% { opacity: 0.42; }
        }

        @keyframes ufoFloat {
          0%, 100% { transform: translateY(0px) rotate(-2deg); }
          50% { transform: translateY(-8px) rotate(2deg); }
        }

        @keyframes floatCard {
          0%, 100% { transform: translateY(0px); }
          50% { transform: translateY(-7px); }
        }

        @keyframes shine {
          0%, 70%, 100% { transform: translateX(-120%); }
          25% { transform: translateX(120%); }
        }

        @keyframes earthFloat {
          0%, 100% { transform: translateY(0px); }
          50% { transform: translateY(-8px); }
        }

        @keyframes moonFloat {
          0%, 100% { transform: translateY(0px); }
          50% { transform: translateY(-6px); }
        }

        @keyframes spinEarth {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }

        @keyframes shoot1 {
          0%   { transform: translate(0,0) rotate(-35deg); opacity: 0; }
          10%  { opacity: 1; }
          70%  { opacity: 1; }
          100% { transform: translate(-95px, 95px) rotate(-35deg); opacity: 0; }
        }

        @keyframes shoot2 {
          0%   { transform: translate(0,0) rotate(-35deg); opacity: 0; }
          18%  { opacity: 1; }
          75%  { opacity: 1; }
          100% { transform: translate(-78px, 78px) rotate(-35deg); opacity: 0; }
        }
      </style>

      <div class="banner">
        <div class="stars"></div>
        <div class="stars2"></div>
        <div class="stars3"></div>

        <div class="content">
          <div class="left">
            <div class="hello-wrap">
              <div class="hello">Hi Aliens!</div>
              <div class="ufo">🛸</div>
              <div class="ufo-trail"></div>
            </div>

            <div class="intro">I'm Vu Manh Tien from the Earth.</div>
            <div class="role">JAVA BACKEND DEVELOPER</div>

            <div class="icons-row">
              <div class="icon-card">
                <img src="https://skillicons.dev/icons?i=java&amp;theme=dark" alt="Java" />
                <span>Java</span>
              </div>

              <div class="icon-card">
                <img src="https://skillicons.dev/icons?i=spring&amp;theme=dark" alt="Spring Boot" />
                <span>Spring Boot</span>
              </div>

              <div class="icon-card">
                <img src="https://skillicons.dev/icons?i=postgres&amp;theme=dark" alt="PostgreSQL" />
                <span>PostgreSQL</span>
              </div>

              <div class="icon-card">
                <img src="https://skillicons.dev/icons?i=redis&amp;theme=dark" alt="Redis" />
                <span>Redis</span>
              </div>

              <div class="icon-card">
                <img src="https://skillicons.dev/icons?i=docker&amp;theme=dark" alt="Docker" />
                <span>Docker</span>
              </div>

              <div class="icon-card">
                <img src="https://skillicons.dev/icons?i=react&amp;theme=dark" alt="React" />
                <span>React</span>
              </div>

              <div class="icon-card">
                <img src="https://skillicons.dev/icons?i=ts&amp;theme=dark" alt="TypeScript" />
                <span>TypeScript</span>
              </div>
            </div>
          </div>

          <div class="right">
            <div class="moon"></div>
            <div class="shooting"></div>
            <div class="shooting2"></div>

            <div class="earth-wrap">
              <div class="earth-glow"></div>
              <div class="ring"></div>

              <div class="earth">
                <div class="continent c1"></div>
                <div class="continent c2"></div>
                <div class="continent c3"></div>
                <div class="continent c4"></div>
                <div class="continent c5"></div>
                <div class="continent c6"></div>
              </div>

              <div class="earth-shadow"></div>
            </div>
          </div>
        </div>

        <div class="bottom-fade"></div>
      </div>
    </div>
  </foreignObject>
</svg>
